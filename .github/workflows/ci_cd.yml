name: Deploy to new-dev
on:
  push:
    branches:
      - new-dev

jobs:
  redeploy_frontend:
    name: Deploy frontend to new-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: SSH Into Server and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 16.16.205.158
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /thiredx/thirdxui
            sudo git stash
            sudo git fetch --all
            sudo git checkout new-dev
            sudo git pull origin new-dev
            git log -1
            sudo npm install -f
            sudo npm run build 

